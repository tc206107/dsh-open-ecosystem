# dsh-git-autoinit bundle patch
#
# This file is the `dsh.bundle.patch` layer of the local npm package: when the
# package is registered in the profile's `dsh.profile.bundles`, the profile
# boot merges THIS patch (a single `insert` of the plugin row) so the plugin
# mounts automatically on every `dsh web` start.
- insert:
    - id: git-autoinit
      name: 'dsh-git-autoinit'
